# Dracula Classic for fcitx5 classicui — matches the AGS bar / rofi / swaync.
# Tokens from dracula-spec.mdx (Dracula Classic), mapped through the same
# semantic roles as theme/_semantic.scss:
#   surface   #343746  Floating interactive elements -> panel background
#   text      #F8F8F2  Foreground
#   comment   #6272A4  Current Line / Comment -> border, separators, dim text
#   accent    #BD93F9  Purple -> highlight background
#   on-accent #282A36  Background -> text on highlight
# No [AccentColorField] on purpose: UseAccentColor=True must not repaint the
# panel with the system accent, these are exact spec colors.

[Metadata]
Name=Dracula Classic
Version=1
Author=Alucard Shell
Description=Dracula Classic (dark) — matches the AGS bar, rofi and swaync
ScaleWithDPI=True

[InputPanel]
NormalColor=#F8F8F2
HighlightColor=#282A36
HighlightCandidateColor=#282A36
HighlightCandidateLabelColor=#282A36
HighlightCandidateCommentColor=#282A36
CandidateCommentColor=#6272A4
HighlightBackgroundColor=#BD93F9
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color=#343746
BorderColor=#6272A4
BorderWidth=1

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color=#BD93F9

[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#F8F8F2
HighlightColor=#282A36
HighlightCandidateColor=#282A36

[Menu/Background]
Color=#343746
BorderColor=#6272A4
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Color=#BD93F9

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#6272A4

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
