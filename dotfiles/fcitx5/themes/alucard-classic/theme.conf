# Alucard Classic (Dracula light) for fcitx5 classicui — matches alacritty / fish.
# Tokens from dracula-spec.mdx (Alucard Classic), mapped through the same
# semantic roles as theme/_semantic.scss:
#   surface   #EFEDDC  Floating interactive elements -> panel background
#   text      #1F1F1F  Foreground
#   comment   #6C664B  Current Line / Comment -> border, separators, dim text
#   accent    #644AC9  Purple -> highlight background
#   on-accent #FFFBEB  Background -> text on highlight
# No [AccentColorField] on purpose: UseAccentColor=True must not repaint the
# panel with the system accent, these are exact spec colors.

[Metadata]
Name=Alucard Classic
Version=1
Author=Alucard Shell
Description=Alucard Classic (light) — matches alacritty and fish
ScaleWithDPI=True

[InputPanel]
NormalColor=#1F1F1F
HighlightColor=#FFFBEB
HighlightCandidateColor=#FFFBEB
HighlightCandidateLabelColor=#FFFBEB
HighlightCandidateCommentColor=#FFFBEB
CandidateCommentColor=#6C664B
HighlightBackgroundColor=#644AC9
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color=#EFEDDC
BorderColor=#6C664B
BorderWidth=1

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color=#644AC9

[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#1F1F1F
HighlightColor=#FFFBEB
HighlightCandidateColor=#FFFBEB

[Menu/Background]
Color=#EFEDDC
BorderColor=#6C664B
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Color=#644AC9

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#6C664B

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
